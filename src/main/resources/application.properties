spring.application.name=fundio-ai-chatbot

server.port=8085

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3:8b


# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/fundio_ai
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10


# Spring AI PGvector configuration
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW





# Ollama embedding model
spring.ai.ollama.embedding.model=qwen3-embedding:0.6b

# Spring AI embedding provider
spring.ai.model.embedding=ollama


spring.profiles.active=local







# Application logging
logging.level.root=INFO
logging.level.com.fundio.aichatbot=DEBUG

# Log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n


